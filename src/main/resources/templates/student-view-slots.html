<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${group.title}"></title>
</head>
<body>
    <h2 th:text="${group.title}"></h2>
    <div th:if="${param.error != null and param.error[0] == 'alreadyBooked'}">
        <p> ERROR: already booked a slot in this group.</p>
    </div>
    <ol>
        <li th:each="slot : ${slots}">
            
            <span th:text="${#temporals.format(slot.startTime, 'yyyy-MM-dd HH:mm')}"></span> -
            <span th:text="${#temporals.format(slot.endTime, 'yyyy-MM-dd HH:mm')}"></span>
            <form th:action="@{/student-dashboard/group/{groupId}/slots/{slotId}/book(groupId=${group.id},slotId=${slot.id})}" method="post">
                <div th:if="${group.type == 'group'}">
                    <label> Add student's Emails</label><br>
                    <input type = "text" name = "emails" placeholder="student2@iu.edu, student3@iu.edu" style="width: 300px;">
                </div>
                <button type="submit">Book</button>
            </form>
        </li>
    </ol>
<a th:href="@{/student-dashboard}">Back to dashboard</a>
</body>
</html>
